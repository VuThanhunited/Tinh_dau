# ====================================
# Nginx Config cho Tinh Dau Web
# File: /etc/nginx/sites-available/tinhdau
# ====================================

server {
    listen 80;
    server_name tinhdautramhuonggiang.com.vn www.tinhdautramhuonggiang.com.vn;

    # Upload size
    client_max_body_size 10M;

    # ---- Backend API ----
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Backend Images ----
    location /img/ {
        proxy_pass http://127.0.0.1:5000/img/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- Admin Panel ----
    location /admin {
        alias /var/www/tinh-dau-web/admin/dist;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # ---- Frontend (default) ----
    location / {
        root /var/www/tinh-dau-web/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
